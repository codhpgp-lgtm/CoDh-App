<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>CoDH Hospital Requests</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1020;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% -20%,#26346b 0,transparent 45%),#0b1020}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:44px;height:44px;border-radius:14px;background:#5145e5;display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:0 10px 30px #5145e544}.brand h1{font-size:17px;margin:0;color:white}.brand p{margin:4px 0 0;color:#9ca3af;font-size:12px}.top-actions{display:flex;align-items:center;gap:12px}.icon-btn,.profile-trigger{border:1px solid #293247;background:#11182a;color:#e5e7eb;border-radius:13px;padding:10px 13px}.profile-wrap{position:relative}.profile-trigger{display:flex;align-items:center;gap:10px;text-align:left}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#4137b8;color:#fff;font-size:12px;font-weight:800}.profile-name{font-size:12px;font-weight:700;color:white}.profile-role{display:block;color:#9ca3af;font-size:10px;margin-top:3px}.profile-menu{position:absolute;right:0;top:calc(100% + 9px);width:245px;background:#11182a;border:1px solid #293247;padding:14px;border-radius:16px;box-shadow:0 18px 48px #0008;z-index:5}.profile-menu[hidden]{display:none}.profile-menu .profile-detail{padding:10px 2px;border-bottom:1px solid #293247;margin-bottom:10px;font-size:12px;line-height:1.8}.profile-menu button{width:100%;text-align:left;background:transparent;color:#e5e7eb;border:0;padding:10px;border-radius:9px}.profile-menu button:hover{background:#1c263c}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}.sidebar,.panel,.welcome{border:1px solid #202a3d;background:#111827eF;border-radius:20px}.sidebar{padding:14px;height:max-content}.nav-btn{width:100%;border:0;background:transparent;color:#9ca3af;text-align:left;padding:13px 14px;border-radius:12px;font-size:13px;margin:3px 0}.nav-btn:hover,.nav-btn.active{background:#5145e5;color:white}.content{min-width:0}.welcome{padding:25px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.welcome h2{margin:0;color:white;font-size:22px}.welcome p{margin:8px 0 0;color:#9ca3af;font-size:13px}.pill,.status{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;background:#20284a;color:#c7d2fe}.status.pending{background:#3a2c13;color:#facc15}.status.approved{background:#103326;color:#6ee7b7}.status.rejected{background:#3b1e28;color:#fda4af}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{padding:18px}.stat span{font-size:11px;color:#9ca3af}.stat strong{display:block;font-size:25px;color:white;margin-top:8px}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h3{margin:0;color:white;font-size:15px}.muted{color:#9ca3af;font-size:12px}.user-row,.request-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-top:1px solid #202a3d}.user-info strong{display:block;color:white;font-size:13px}.user-info small{display:block;color:#9ca3af;margin-top:5px;font-size:11px}.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.select,.input{width:100%;border:1px solid #303b50;background:#0b1020;color:#e5e7eb;border-radius:10px;padding:10px 12px;font-size:12px}.dept-select{min-width:195px}.btn{border:1px solid transparent;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;background:#5145e5;color:#fff}.btn:hover{filter:brightness(1.13)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#202a3d;border-color:#303b50;color:#d1d5db}.btn.danger{background:#6f2636}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:11px;color:#cbd5e1;margin:0 0 6px}.field.full{grid-column:1/-1}.empty{padding:30px;text-align:center;color:#9ca3af;font-size:13px}.toast{position:fixed;right:24px;bottom:24px;padding:13px 17px;border-radius:12px;background:#173c30;border:1px solid #287454;color:#d1fae5;font-size:13px;z-index:10;box-shadow:0 10px 30px #0006}.toast.error{background:#4b2027;border-color:#883541;color:#ffe4e6}.notice{font-size:11px;color:#a5b4fc;line-height:1.5}.signin{max-width:440px;margin:9vh auto;padding:30px}.signin h2{color:white;margin:0 0 8px}.signin form{display:grid;gap:14px;margin-top:22px}.hidden{display:none!important}.tagline{font-size:11px;color:#9ca3af;margin-top:15px;line-height:1.6}@media(max-width:850px){.shell{padding:18px}.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:4px}.nav-btn{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.shell{padding:12px}.topbar{align-items:flex-start}.brand p{display:none}.profile-name,.profile-role{display:none}.profile-trigger{padding:7px}.welcome{align-items:flex-start;flex-direction:column}.grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.user-row,.request-row{align-items:flex-start;flex-direction:column}.dept-select{width:100%}.row-actions{width:100%}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Standalone prototype: state is stored in this browser only. Connect Firebase Auth/Firestore
    // and enforce admin/department permissions in trusted backend rules before production use.
    const DEPARTMENTS=['Medical Section','Administrative Section','Nursing Section','Pharmacy Section','Radiology Section','Laboratory Section'];
    const seedUsers=[
      {id:'admin-1',name:'Khean Lisondra',email:'kheanlisondrafinal@gmail.com',role:'Admin',dept:'System Administration',status:'Approved'},
      {id:'user-1',name:'Juan Cruz',email:'juan.cruz@company.com',role:'Employee',dept:'Medical Section',status:'Approved'},
      {id:'head-1',name:'Alex Reyes',email:'alex.reyes@company.com',role:'Department Head',dept:'Medical Section',status:'Approved'},
      {id:'pending-1',name:'Maria Santos',email:'maria.santos@hospital.gov',role:'Employee',dept:'',status:'Pending'},
      {id:'pending-2',name:'Paolo Dela Cruz',email:'paolo.dc@hospital.gov',role:'Department Head',dept:'',status:'Pending'}
    ];
    const store={read(key,fallback){try{const v=JSON.parse(localStorage.getItem('codh-'+key));return v??fallback}catch{return fallback}},write(key,val){localStorage.setItem('codh-'+key,JSON.stringify(val))}};
    let users=store.read('users',seedUsers), requests=store.read('requests',[]), currentUser=null, activeView='dashboard';
    const root=document.getElementById('root');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials=name=>String(name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
    function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
    function persist(){store.write('users',users);store.write('requests',requests)}
    function departmentSelect(user){return `<select class="select dept-select" aria-label="Assign hospital department to ${esc(user.name)}" data-department="${esc(user.id)}"><option value="">Choose department before activation</option>${DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${user.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`}
    function appShell(){const pending=users.filter(u=>u.status==='Pending');const viewTitle=activeView==='dashboard'?'Dashboard':activeView==='users'?'User management':activeView==='requests'?'Requests':'New request';return `<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">✚</div><div><h1>CoDH Hospital Requests</h1><p>Coron District Hospital · Request and approval portal</p></div></div><div class="top-actions"><div class="profile-wrap"><button class="profile-trigger" id="profileToggle" aria-expanded="false"><span class="avatar">${initials(currentUser.name)}</span><span><span class="profile-name">${esc(currentUser.name)}</span><span class="profile-role">${esc(currentUser.role)} · ${esc(currentUser.dept||'Department pending')}</span></span><span aria-hidden="true">⌄</span></button><div class="profile-menu" id="profileMenu" hidden><div class="profile-detail"><strong>${esc(currentUser.name)}</strong><br>${esc(currentUser.email)}<br>${esc(currentUser.role)} · ${esc(currentUser.dept||'Department pending')}</div><button id="profileView">View profile details</button><button id="signOut">Sign out</button></div></div></div></header><div class="layout"><nav class="sidebar" aria-label="Main navigation">${[['dashboard','▦','Dashboard'],['new-request','＋','File a request'],['requests','☷','My requests'],...(currentUser.role==='Admin'?[['users','♙','User management']]:[])].map(([id,icon,label])=>`<button class="nav-btn ${activeView===id?'active':''}" data-view="${id}">${icon}&nbsp;&nbsp;${label}</button>`).join('')}</nav><main class="content"><section class="welcome"><div><h2>${viewTitle}</h2><p>Welcome back, ${esc(currentUser.name)}. Your assigned department is ${esc(currentUser.dept||'pending admin assignment')}.</p></div><span class="pill">${esc(currentUser.role)}</span></section>${activeView==='dashboard'?dashboard(pending):activeView==='users'?userManagement(pending):activeView==='requests'?requestList():requestForm()}</main></div></div>`}
    function dashboard(pending){const myRequests=requests.filter(r=>currentUser.role==='Admin'||r.userId===currentUser.id);return `${currentUser.role==='Admin'?`<div class="grid"><section class="panel stat"><span>Registered users</span><strong>${users.length}</strong></section><section class="panel stat"><span>Awaiting activation</span><strong>${pending.length}</strong></section><section class="panel stat"><span>Requests on file</span><strong>${requests.length}</strong></section></div><section class="panel"><div class="panel-head"><h3>Pending registrations · department tagging required</h3><span class="status pending">${pending.length} pending</span></div><p class="muted">Choose the correct hospital department for each applicant. The Activate button remains unavailable until a department is assigned and saved.</p>${pending.length?pending.map(u=>`<div class="user-row"><div class="user-info"><strong>${esc(u.name)}</strong><small>${esc(u.email)} · ${esc(u.role)}</small></div><div class="row-actions">${departmentSelect(u)}<button class="btn secondary" data-save-dept="${esc(u.id)}">Save assignment</button><button class="btn" data-activate="${esc(u.id)}" ${u.dept?'':'disabled'}>Activate</button><button class="btn danger" data-reject="${esc(u.id)}">Reject</button></div></div>`).join(''):'<div class="empty">No registrations are waiting for review.</div>'}`:`<section class="panel"><div class="panel-head"><h3>My request summary</h3><button class="btn" data-view="new-request">＋ New request</button></div><p class="muted">Your requests and approval progress appear here.</p>${myRequests.length?myRequests.slice(0,5).map(requestRow).join(''):'<div class="empty">You have not submitted any requests yet.</div>'}</section>`}`}
    function userManagement(pending){return `<section class="panel"><div class="panel-head"><div><h3>User directory and activation</h3><span class="muted">Assign a department before activating a pending account.</span></div><span class="pill">${users.length} users</span></div>${users.map(u=>`<div class="user-row"><div class="user-info"><strong>${esc(u.name)}</strong><small>${esc(u.email)} · ${esc(u.role)} · ${esc(u.dept||'Department not assigned')}</small><small>Status: <span class="status ${u.status==='Approved'?'approved':u.status==='Rejected'?'rejected':'pending'}">${esc(u.status)}</span></small></div>${u.status==='Pending'?`<div class="row-actions">${departmentSelect(u)}<button class="btn secondary" data-save-dept="${esc(u.id)}">Save</button><button class="btn" data-activate="${esc(u.id)}" ${u.dept?'':'disabled'}>Activate</button><button class="btn danger" data-reject="${esc(u.id)}">Reject</button></div>`:''}</div>`).join('')}</section>`}
    function requestRow(r){return `<div class="request-row"><div class="user-info"><strong>${esc(r.type)} · ${esc(r.id)}</strong><small>${esc(r.section)} · Filed ${esc(r.date)}</small></div><span class="status ${r.status==='Approved'?'approved':'pending'}">${esc(r.status)}</span></div>`}
    function requestList(){const mine=requests.filter(r=>currentUser.role==='Admin'||r.userId===currentUser.id);return `<section class="panel"><div class="panel-head"><h3>${currentUser.role==='Admin'?'All hospital requests':'My requests'}</h3><button class="btn" data-view="new-request">＋ File request</button></div>${mine.length?mine.map(requestRow).join(''):'<div class="empty">No requests found.</div>'}</section>`}
    function requestForm(){return `<section class="panel"><div class="panel-head"><div><h3>Submit a hospital request</h3><span class="muted">Your request will be associated with your assigned department.</span></div></div><form id="requestForm"><div class="form-grid"><div class="field"><label for="requestType">Request type</label><select class="select" id="requestType" required><option>Leave</option><option>Missed Log</option><option>Exchange of Duty</option><option>Extra Off Request</option></select></div><div class="field"><label for="requestSection">Hospital department</label><input class="input" id="requestSection" value="${esc(currentUser.dept)}" readonly></div><div class="field full"><label for="reason">Reason / justification</label><input class="input" id="reason" required maxlength="500" placeholder="Describe your request"></div><div class="field full"><button class="btn" type="submit">Submit request</button></div></div></form></section>`}
    function loginScreen(){root.innerHTML=`<main class="shell"><section class="panel signin"><div class="brand"><div class="brand-mark">✚</div><div><h1>CoDH Hospital Requests</h1><p>Coron District Hospital</p></div></div><h2 style="margin-top:28px">Sign in to your portal</h2><p class="muted">This standalone demo runs in your browser and does not provide production authentication.</p><form id="loginForm"><div class="field"><label for="email">Demo account</label><select class="select" id="email">${users.filter(u=>u.status==='Approved').map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${esc(u.role)}</option>`).join('')}</select></div><button class="btn" type="submit">Continue as selected user</button></form><hr style="border:0;border-top:1px solid #293247;margin:22px 0"><h3>Request an account</h3><form id="registerForm"><div class="field"><label for="regName">Full name</label><input class="input" id="regName" required maxlength="100"></div><div class="field" style="margin-top:12px"><label for="regEmail">Email address</label><input class="input" id="regEmail" type="email" required maxlength="160"></div><div class="field" style="margin-top:12px"><label for="regRole">Requested role</label><select class="select" id="regRole"><option>Employee</option><option>Department Head</option><option>Administrative Officer V</option><option>Chief of Hospital</option></select></div><button class="btn secondary" style="margin-top:14px" type="submit">Submit registration for admin review</button></form><p class="tagline">New registrations stay pending until an administrator assigns a hospital department and activates the account.</p></section></main>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();currentUser=users.find(u=>u.id===document.getElementById('email').value);render()};document.getElementById('registerForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('regEmail').value.trim().toLowerCase();if(users.some(u=>u.email.toLowerCase()===email)){toast('That email is already registered.',true);return}users.push({id:'user-'+Date.now(),name:document.getElementById('regName').value.trim(),email,role:document.getElementById('regRole').value,dept:'',status:'Pending'});persist();toast('Registration submitted. An administrator must assign your department before activation.');loginScreen()}}
    function render(){if(!currentUser){loginScreen();return}root.innerHTML=appShell();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});const toggle=document.getElementById('profileToggle'),menu=document.getElementById('profileMenu');toggle.onclick=()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))};document.getElementById('signOut').onclick=()=>{currentUser=null;loginScreen()};document.getElementById('profileView').onclick=()=>toast(`${currentUser.name} · ${currentUser.role} · ${currentUser.dept||'Department pending'}`);document.querySelectorAll('[data-department]').forEach(s=>s.onchange=()=>{const u=users.find(x=>x.id===s.dataset.department);u.dept=s.value;if(u.role==='Department Head')u.headOfDept=s.value;persist();const activate=document.querySelector(`[data-activate="${CSS.escape(u.id)}"]`);if(activate)activate.disabled=!u.dept});document.querySelectorAll('[data-save-dept]').forEach(b=>b.onclick=()=>{const u=users.find(x=>x.id===b.dataset.saveDept);const s=document.querySelector(`[data-department="${CSS.escape(u.id)}"]`);if(!s?.value){toast('Choose a hospital department first.',true);return}u.dept=s.value;if(u.role==='Department Head')u.headOfDept=s.value;persist();toast(`Department saved for ${u.name}.`);render()});document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>{const u=users.find(x=>x.id===b.dataset.activate);if(!u?.dept){toast('Assign and save a department before activation.',true);return}u.status='Approved';persist();toast(`${u.name} activated in ${u.dept}.`);render()});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const u=users.find(x=>x.id===b.dataset.reject);if(u){u.status='Rejected';persist();toast(`Registration for ${u.name} rejected.`);render()}});const form=document.getElementById('requestForm');if(form)form.onsubmit=e=>{e.preventDefault();requests.unshift({id:'REQ-'+Date.now(),userId:currentUser.id,type:document.getElementById('requestType').value,section:currentUser.dept,date:new Date().toLocaleDateString(),status:'Pending Dept Head Approval',reason:document.getElementById('reason').value.trim()});persist();toast('Request submitted.');activeView='requests';render()}}
    render();
  </script>
</body>
</html>
