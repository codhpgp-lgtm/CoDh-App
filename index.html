<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>CoDH | Hospital Request Portal</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1020;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% -18%,#252f61 0,transparent 42%),#0b1020}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}.sidebar{background:#080d19;border-right:1px solid #202a3d;padding:22px 15px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:12px;padding:0 7px}.brand-mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(140deg,#635bff,#4036cb);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:900;box-shadow:0 10px 28px #5145e544}.brand h1{font-size:14px;letter-spacing:.01em;margin:0;color:#fff}.brand p{margin:4px 0 0;color:#7f8ba3;font-size:10px}.nav-label{padding:0 12px;color:#65718a;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.nav{display:grid;gap:5px}.nav-btn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#9aa6ba;text-align:left;padding:12px;border-radius:11px;font-size:12px;font-weight:650}.nav-btn:hover,.nav-btn.active{background:#252050;color:white}.nav-icon{width:20px;text-align:center;font-size:16px}.nav-count{margin-left:auto;background:#a97822;color:#fff3d4;border-radius:999px;padding:3px 7px;font-size:9px}.sidebar-spacer{flex:1}.sidebar-note{font-size:10px;color:#66728a;line-height:1.55;border-top:1px solid #202a3d;padding:15px 6px 0}.main{min-width:0;padding:24px 32px 48px}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}.crumb{font-size:12px;color:#8390a7}.crumb strong{color:#e5e7eb}.top-actions{display:flex;align-items:center;gap:10px}.profile-wrap{position:relative}.profile-trigger{display:flex;align-items:center;gap:10px;text-align:left;background:#121a2b;border:1px solid #29344a;color:white;border-radius:14px;padding:6px 10px 6px 7px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,#635bff,#4338ca);color:#fff;font-size:11px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{display:block;color:white;font-size:11px;font-weight:750}.profile-role{display:block;color:#8e9bb2;font-size:9px;margin-top:3px}.profile-menu{position:absolute;right:0;top:calc(100% + 9px);width:270px;padding:14px;background:#121a2b;border:1px solid #29344a;border-radius:15px;box-shadow:0 20px 50px #0009;z-index:5}.profile-menu[hidden]{display:none}.profile-detail{display:flex;align-items:center;gap:11px;padding:2px 2px 13px;border-bottom:1px solid #29344a;margin-bottom:8px}.profile-detail strong{font-size:12px;color:#fff}.profile-detail small{display:block;color:#8e9bb2;margin-top:4px;font-size:10px}.menu-action{display:block;width:100%;border:0;background:transparent;color:#d4dbea;text-align:left;padding:10px;border-radius:9px;font-size:11px}.menu-action:hover{background:#202a3d}.profile-upload{font-size:10px;color:#aeb9cd;padding:8px 10px}.profile-upload input{display:block;width:100%;font-size:10px;margin-top:7px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:20px}.page-head h2{color:#fff;font-size:24px;letter-spacing:-.03em;margin:0}.page-head p{font-size:12px;color:#8e9bb2;margin:7px 0 0}.role-pill,.pill{display:inline-flex;align-items:center;border:1px solid #34365f;background:#201e43;color:#c5c2ff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:750}.welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;margin-bottom:16px;border:1px solid #292f4d;background:linear-gradient(110deg,#181a35,#111827 64%);border-radius:17px}.welcome h3{margin:0;color:#fff;font-size:17px}.welcome p{margin:7px 0 0;color:#9ba6ba;font-size:11px}.welcome-icon{font-size:28px;opacity:.8}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 17px}.stat,.panel{background:#111827;border:1px solid #202a3d;border-radius:16px}.stat{padding:17px}.stat-label{display:flex;justify-content:space-between;align-items:center;color:#9aa6bb;font-size:10px}.stat-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#24204c;color:#b8b2ff;font-size:13px}.stat strong{display:block;font-size:24px;color:#fff;margin-top:9px;letter-spacing:-.04em}.stat-caption{font-size:9px;color:#75829a;margin-top:4px}.panel{padding:19px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel-title{margin:0;color:#fff;font-size:13px;font-weight:750}.panel-subtitle{display:block;color:#8794aa;font-size:10px;margin-top:5px}.panel-head-actions{display:flex;align-items:center;gap:9px}.notice{background:#191935;border:1px solid #34315c;border-radius:11px;padding:11px 13px;color:#c2bfff;font-size:10px;line-height:1.5;margin:12px 0}.user-row,.request-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-top:1px solid #202a3d}.user-identity{display:flex;align-items:center;gap:10px;min-width:170px}.mini-avatar{width:33px;height:33px;display:grid;place-items:center;flex:none;border-radius:11px;background:#22294a;color:#c1c8ff;font-size:10px;font-weight:800}.user-info strong{display:block;color:#f5f6fa;font-size:11px}.user-info small{display:block;color:#8692a8;margin-top:4px;font-size:9px}.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.select,.input,.textarea{background:#0b1020;border:1px solid #303b50;color:#e5e7eb;border-radius:9px;padding:9px 10px;font-size:10px;outline:none}.select:focus,.input:focus,.textarea:focus{border-color:#7068ff;box-shadow:0 0 0 3px #5145e522}.dept-select{min-width:185px}.btn{border:1px solid transparent;border-radius:9px;padding:9px 12px;background:#5145e5;color:#fff;font-size:10px;font-weight:750;white-space:nowrap}.btn:hover{filter:brightness(1.13)}.btn.secondary{border-color:#323d53;background:#1a2437;color:#d6dbea}.btn.danger{border-color:#5b2b3b;background:#401e2a;color:#ffc2cb}.btn.ghost{background:transparent;border-color:#323d53;color:#cbd5e1}.status{display:inline-flex;white-space:nowrap;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:750;background:#362b15;color:#f4cd69}.status.approved{background:#123328;color:#75e0b0}.status.rejected{background:#3b1e28;color:#fda4af}.status.review{background:#202a48;color:#a8c5ff}.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}.table-head{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(120px,1fr) 110px 120px;gap:10px;padding:8px 12px;color:#65718a;font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.request-row{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(120px,1fr) 110px 120px;gap:10px;padding:12px;align-items:center}.request-main strong{display:block;color:#c1bdff;font-size:10px}.request-main small{display:block;color:#8e9bb2;font-size:9px;margin-top:5px}.request-cell{font-size:10px;color:#c6cedc}.empty{padding:28px;text-align:center;color:#8490a6;font-size:11px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;color:#b9c3d4;font-size:10px;margin:0 0 6px}.field.full{grid-column:1/-1}.input,.textarea{width:100%;font-size:11px}.textarea{resize:vertical;min-height:95px}.form-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.empty-state{text-align:center;padding:35px 20px;color:#8794aa}.empty-state strong{display:block;color:#dce1ed;font-size:12px;margin:8px 0}.empty-state span{font-size:10px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;padding:12px 16px;border-radius:11px;background:#173c30;border:1px solid #287454;color:#d1fae5;font-size:11px;box-shadow:0 10px 30px #0007}.toast.error{background:#4b2027;border-color:#883541;color:#ffe4e6}.signin-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#252f61 0,transparent 50%),#0b1020}.signin{width:min(440px,100%);background:#111827;border:1px solid #29344a;border-radius:20px;padding:28px;box-shadow:0 25px 80px #0006}.signin h2{font-size:21px;color:#fff;margin:25px 0 6px}.signin p{font-size:10px;color:#8e9bb2;line-height:1.6}.signin form{display:grid;gap:12px;margin-top:15px}.signin .input,.signin .select{width:100%}.divider{border:0;border-top:1px solid #29344a;margin:22px 0}.secure-note{font-size:9px!important;color:#77849c!important}.mobile-menu{display:none}
    @media(max-width:1050px){.main{padding:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:12px;border-right:0;border-bottom:1px solid #202a3d}.sidebar .brand,.sidebar-note,.nav-label{display:none}.nav{display:flex;overflow:auto}.nav-btn{width:auto;white-space:nowrap;padding:10px 12px}.sidebar-spacer{display:none}.main{padding:14px}.topbar{height:auto;margin-bottom:18px}.table-head{display:none}.request-row{grid-template-columns:1fr auto}.request-cell:nth-child(2){display:none}.row-actions{justify-content:flex-start}.user-row{align-items:flex-start;flex-direction:column}.row-actions{width:100%;justify-content:flex-start}.dept-select{flex:1;min-width:160px}}
    @media(max-width:500px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat strong{font-size:20px}.main{padding:11px}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:21px}.profile-name,.profile-role{display:none}.profile-trigger{padding:6px}.panel{padding:14px}.welcome{padding:17px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.request-row{padding:11px 5px}.panel-head{align-items:flex-start}.panel-head-actions{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // UI demo only: data lives in this browser's localStorage. Authentication and authorization
    // must be implemented and enforced by a trusted backend before using real staff data.
    const DEPARTMENTS=['Medical Section','Administrative Section','Nursing Section','Pharmacy Section','Radiology Section','Laboratory Section'];
    const seedUsers=[
      {id:'admin-1',name:'Khean Lisondra',email:'kheanlisondrafinal@gmail.com',role:'Admin',dept:'System Administration',status:'Approved',avatar:''},
      {id:'user-1',name:'Juan Cruz',email:'juan.cruz@company.com',role:'Employee',dept:'Medical Section',status:'Approved',avatar:''},
      {id:'head-1',name:'Alex Reyes',email:'alex.reyes@company.com',role:'Department Head',dept:'Medical Section',headOfDept:'Medical Section',status:'Approved',avatar:''},
      {id:'pending-1',name:'Maria Santos',email:'maria.santos@hospital.gov',role:'Employee',dept:'',status:'Pending',avatar:''},
      {id:'pending-2',name:'Paolo Dela Cruz',email:'paolo.dc@hospital.gov',role:'Department Head',dept:'',status:'Pending',avatar:''}
    ];
    const storage={read(key,fallback){try{const value=JSON.parse(localStorage.getItem('codh-'+key));return value??fallback}catch{return fallback}},write(key,value){try{localStorage.setItem('codh-'+key,JSON.stringify(value))}catch{notify('Browser storage is full; profile photo could not be saved.',true)}}};
    let users=storage.read('users',seedUsers),requests=storage.read('requests',[]),currentUser=null,activeView='dashboard';
    const root=document.getElementById('root');
    const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const initials=name=>String(name||'?').trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
    function notify(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
    function persist(){storage.write('users',users);storage.write('requests',requests)}
    function avatarHTML(user,small=false){const size=small?'mini-avatar':'avatar';return `<span class="${size}">${user.avatar?`<img alt="${escapeHTML(user.name)} profile photo" src="${escapeHTML(user.avatar)}">`:escapeHTML(initials(user.name))}</span>`}
    function navButton(id,icon,label,count=''){return `<button class="nav-btn ${activeView===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}${count?`<span class="nav-count">${count}</span>`:''}</button>`}
    function deptSelect(user){return `<select class="select dept-select" aria-label="Assign department to ${escapeHTML(user.name)}" data-department="${escapeHTML(user.id)}"><option value="">Select hospital department</option>${DEPARTMENTS.map(dept=>`<option value="${escapeHTML(dept)}" ${user.dept===dept?'selected':''}>${escapeHTML(dept)}</option>`).join('')}</select>`}
    function statusClass(status){return status==='Approved'?'approved':status==='Rejected'?'rejected':status.includes('Final')?'review':'pending'}
    function appShell(){const pending=users.filter(user=>user.status==='Pending');const viewTitle={dashboard:'Dashboard','new-request':'File a request',requests:'Request history',approvals:'Approvals queue',users:'User management'}[activeView]||'Dashboard';return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">✚</div><div><h1>CoDH Hospital Requests</h1><p>CORON DISTRICT HOSPITAL</p></div></div><div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation">${navButton('dashboard','▦','Dashboard')}${navButton('new-request','＋','File a request')}${navButton('requests','☷','Request history')}${['Admin','Department Head','Administrative Officer V','Chief of Hospital'].includes(currentUser.role)?navButton('approvals','✓','Approvals queue',pending.length?pending.length:''):''}${currentUser.role==='Admin'?navButton('users','♙','User management',pending.length?pending.length:''):''}</nav></div><div class="sidebar-spacer"></div><div class="sidebar-note">Coron District Hospital<br>Integrated request and approval portal<br><br>Demo data is stored in this browser only.</div></aside><main class="main"><header class="topbar"><div class="crumb">CoDH portal <span style="color:#4b5670">/</span> <strong>${viewTitle}</strong></div><div class="top-actions"><div class="profile-wrap"><button class="profile-trigger" id="profileToggle" aria-expanded="false">${avatarHTML(currentUser)}<span><span class="profile-name">${escapeHTML(currentUser.name)}</span><span class="profile-role">${escapeHTML(currentUser.role)} · ${escapeHTML(currentUser.dept||'Department pending')}</span></span><span style="color:#8490a6;font-size:11px">⌄</span></button><div class="profile-menu" id="profileMenu" hidden><div class="profile-detail">${avatarHTML(currentUser)}<div><strong>${escapeHTML(currentUser.name)}</strong><small>${escapeHTML(currentUser.email)}</small><small>${escapeHTML(currentUser.role)} · ${escapeHTML(currentUser.dept||'Department pending')}</small></div></div><label class="profile-upload">Update profile photo<input type="file" id="avatarUpload" accept="image/png,image/jpeg,image/webp"></label><button class="menu-action" id="profileDetails">Profile details</button><button class="menu-action" id="signOut">Sign out</button></div></div></div></header><div class="page-head"><div><h2>${viewTitle}</h2><p>Manage hospital requests and keep approvals moving.</p></div><span class="role-pill">${escapeHTML(currentUser.role)}</span></div>${activeView==='dashboard'?dashboard():activeView==='users'?userManagement():activeView==='requests'?requestHistory():activeView==='approvals'?approvalQueue():requestForm()}</main></div>`}
    function statCard(label,value,caption,icon){return `<section class="stat"><div class="stat-label">${label}<span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="stat-caption">${caption}</div></section>`}
    function dashboard(){const mine=requests.filter(req=>currentUser.role==='Admin'||req.userId===currentUser.id);const pendingUsers=users.filter(user=>user.status==='Pending');const openRequests=mine.filter(req=>req.status.startsWith('Pending')).length;return `<section class="welcome"><div><h3>Welcome back, ${escapeHTML(currentUser.name)}</h3><p>${escapeHTML(currentUser.dept||'Your department is awaiting admin assignment')} · ${escapeHTML(currentUser.role)}</p></div><span class="welcome-icon">✦</span></section>${currentUser.role==='Admin'?`<div class="stats">${statCard('Registered users',users.length,'Accounts in the directory','♙')}${statCard('Awaiting activation',pendingUsers.length,'Department assignment required','◷')}${statCard('Total requests',requests.length,'All hospital sections','▤')}${statCard('Open requests',openRequests,'Awaiting a decision','↗')}</div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Registration approvals</h3><span class="panel-subtitle">Assign each applicant to a hospital department before activating.</span></div><span class="status ${pendingUsers.length?'pending':'approved'}"><span class="status-dot"></span>${pendingUsers.length} pending</span></div><div class="notice">Department assignment is required for every new account. Save the assignment first; activation remains disabled until a department is selected.</div>${pendingUsers.length?pendingUsers.map(pendingUserRow).join(''):`<div class="empty">No accounts are waiting for activation.</div>`}</section>${requestTable(mine,'Recent hospital requests')}`:`<div class="stats">${statCard('My requests',mine.length,'Submitted applications','▤')}${statCard('Awaiting approval',openRequests,'Requests in progress','◷')}${statCard('Approved',mine.filter(req=>req.status==='Approved').length,'Completed requests','✓')}${statCard('Department',escapeHTML(currentUser.dept||'Pending'),'Assigned by hospital admin','⌖')}</div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">My recent requests</h3><span class="panel-subtitle">Keep track of the latest applications you submitted.</span></div><button class="btn" data-view="new-request">＋ New request</button></div>${mine.length?requestRows(mine.slice(0,5)):`<div class="empty-state">✦<strong>No requests yet</strong><span>File a request to begin tracking approvals.</span></div>`}</section>`}`}
    function pendingUserRow(user){return `<div class="user-row"><div class="user-identity">${avatarHTML(user,true)}<div class="user-info"><strong>${escapeHTML(user.name)}</strong><small>${escapeHTML(user.email)}</small><small>Requested role: ${escapeHTML(user.role)}</small></div></div><div class="row-actions">${deptSelect(user)}<button class="btn secondary" data-save-dept="${escapeHTML(user.id)}">Save assignment</button><button class="btn" data-activate="${escapeHTML(user.id)}" ${user.dept?'':'disabled'}>Activate</button><button class="btn danger" data-reject="${escapeHTML(user.id)}">Reject</button></div></div>`}
    function userManagement(){return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">Registered users</h3><span class="panel-subtitle">Review account status and assign departments to new applicants.</span></div><span class="pill">${users.length} accounts</span></div>${users.map(user=>`<div class="user-row"><div class="user-identity">${avatarHTML(user,true)}<div class="user-info"><strong>${escapeHTML(user.name)}</strong><small>${escapeHTML(user.email)}</small><small>${escapeHTML(user.role)} · ${escapeHTML(user.dept||'Department not assigned')}</small></div></div><div class="row-actions"><span class="status ${statusClass(user.status)}"><span class="status-dot"></span>${escapeHTML(user.status)}</span>${user.status==='Pending'?`${deptSelect(user)}<button class="btn secondary" data-save-dept="${escapeHTML(user.id)}">Save</button><button class="btn" data-activate="${escapeHTML(user.id)}" ${user.dept?'':'disabled'}>Activate</button><button class="btn danger" data-reject="${escapeHTML(user.id)}">Reject</button>`:''}</div></div>`).join('')}</section>`}
    function requestTable(items,title){return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${title}</h3><span class="panel-subtitle">Latest submissions across the hospital.</span></div></div>${items.length?`<div class="table-head"><span>Application</span><span>Applicant / section</span><span>Date filed</span><span>Status</span></div>${requestRows(items.slice(0,7))}`:`<div class="empty">No requests have been filed yet.</div>`}</section>`}
    function requestRows(items){return items.map(req=>`<div class="request-row"><div class="request-main"><strong>${escapeHTML(req.id)} · ${escapeHTML(req.type)}</strong><small>${escapeHTML(req.reason||'Hospital application')}</small></div><div class="request-cell">${escapeHTML(req.applicantName||'You')}<br><span style="color:#8490a6">${escapeHTML(req.section)}</span></div><div class="request-cell">${escapeHTML(req.date)}</div><div><span class="status ${statusClass(req.status)}"><span class="status-dot"></span>${escapeHTML(req.status)}</span></div></div>`).join('')}
    function requestHistory(){const items=requests.filter(req=>currentUser.role==='Admin'||req.userId===currentUser.id);return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${currentUser.role==='Admin'?'Hospital request history':'My request history'}</h3><span class="panel-subtitle">Current status and request details.</span></div>${currentUser.role!=='Admin'?'<button class="btn" data-view="new-request">＋ File a request</button>':''}</div>${items.length?`<div class="table-head"><span>Application</span><span>Applicant / section</span><span>Date filed</span><span>Status</span></div>${requestRows(items)}`:`<div class="empty-state">☷<strong>No requests found</strong><span>Submitted applications will appear here.</span></div>`}</section>`}
    function approvalQueue(){const assigned=currentUser.role==='Department Head'?currentUser.headOfDept||currentUser.dept:null;const eligible=requests.filter(req=>{if(currentUser.role==='Department Head')return req.section===assigned&&req.status==='Pending Dept Head Approval';if(['Administrative Officer V','Chief of Hospital'].includes(currentUser.role))return req.status==='Pending Final Officer Approval';return currentUser.role==='Admin'&&req.status.startsWith('Pending')});return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">Requests awaiting your review</h3><span class="panel-subtitle">${currentUser.role==='Department Head'?'Department Head review':currentUser.role==='Admin'?'Admin demo review':'Final officer review'}.</span></div><span class="status pending"><span class="status-dot"></span>${eligible.length} to review</span></div>${eligible.length?eligible.map(req=>`<div class="user-row"><div class="user-info"><strong>${escapeHTML(req.id)} · ${escapeHTML(req.type)}</strong><small>${escapeHTML(req.applicantName)} · ${escapeHTML(req.section)}</small><small>${escapeHTML(req.reason)}</small></div><div class="row-actions"><button class="btn danger" data-decision="reject" data-request="${escapeHTML(req.id)}">Decline</button><button class="btn" data-decision="approve" data-request="${escapeHTML(req.id)}">${req.status==='Pending Dept Head Approval'?'Approve stage 1':'Grant final approval'}</button></div></div>`).join(''):`<div class="empty-state">✓<strong>Queue is clear</strong><span>No requests are currently waiting for your review.</span></div>`}</section>`}
    function requestForm(){return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">New hospital request</h3><span class="panel-subtitle">Request follows Department Head review and then final officer review.</span></div></div><form id="requestForm"><div class="form-grid"><div class="field"><label for="requestType">Application type</label><select class="select" id="requestType" required><option>Leave</option><option>Missed Log</option><option>Exchange of Duty</option><option>Extra Off Request</option></select></div><div class="field"><label for="requestSection">Hospital department</label><input class="input" id="requestSection" readonly value="${escapeHTML(currentUser.dept||'Department pending')}"></div><div class="field full"><label for="reason">Reason / justification</label><textarea class="textarea" id="reason" maxlength="500" required placeholder="Explain the reason for your request"></textarea></div></div><div class="form-foot"><button type="button" class="btn ghost" data-view="dashboard">Cancel</button><button class="btn" type="submit">Submit for approval</button></div></form></section>`}
    function loginScreen(){root.innerHTML=`<main class="signin-wrap"><section class="signin"><div class="brand"><div class="brand-mark">✚</div><div><h1>CoDH Hospital Requests</h1><p>CORON DISTRICT HOSPITAL · REQUEST PORTAL</p></div></div><h2>Welcome to your portal</h2><p>Manage requests, follow approval progress, and keep your hospital workflow organized.</p><div class="notice">Demo mode: select a seeded account to explore the interface. This is not a secure sign-in system.</div><form id="loginForm"><div class="field"><label for="demoUser">Choose demo account</label><select class="select" id="demoUser">${users.filter(user=>user.status==='Approved').map(user=>`<option value="${escapeHTML(user.id)}">${escapeHTML(user.name)} · ${escapeHTML(user.role)}</option>`).join('')}</select></div><button class="btn" type="submit">Continue to portal</button></form><hr class="divider"><h3 class="panel-title">Request an account</h3><p>New accounts remain pending until an administrator assigns a department and activates them.</p><form id="registerForm"><div class="field"><label for="regName">Full name</label><input class="input" id="regName" required maxlength="100" placeholder="Your full name"></div><div class="field"><label for="regEmail">Work email</label><input class="input" id="regEmail" type="email" required maxlength="160" placeholder="name@hospital.gov"></div><div class="field"><label for="regRole">Requested role</label><select class="select" id="regRole"><option>Employee</option><option>Department Head</option><option>Administrative Officer V</option><option>Chief of Hospital</option></select></div><button class="btn secondary" type="submit">Submit registration</button></form><p class="secure-note">Prototype data is saved in this browser only. Connect Firebase Authentication and secure Firestore rules before using real user accounts or hospital data.</p></section></main>`;document.getElementById('loginForm').onsubmit=event=>{event.preventDefault();currentUser=users.find(user=>user.id===document.getElementById('demoUser').value)||null;activeView='dashboard';render()};document.getElementById('registerForm').onsubmit=event=>{event.preventDefault();const email=document.getElementById('regEmail').value.trim().toLowerCase();if(users.some(user=>user.email.toLowerCase()===email)){notify('That email is already registered.',true);return}users.push({id:'user-'+Date.now(),name:document.getElementById('regName').value.trim(),email,role:document.getElementById('regRole').value,dept:'',status:'Pending',avatar:''});persist();notify('Registration submitted. Admin assignment is required before activation.');loginScreen()}}
    function render(){if(!currentUser){loginScreen();return}root.innerHTML=appShell();document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{activeView=button.dataset.view;render()});const profileToggle=document.getElementById('profileToggle'),profileMenu=document.getElementById('profileMenu');profileToggle.onclick=()=>{profileMenu.hidden=!profileMenu.hidden;profileToggle.setAttribute('aria-expanded',String(!profileMenu.hidden))};document.getElementById('signOut').onclick=()=>{currentUser=null;render()};document.getElementById('profileDetails').onclick=()=>notify(`${currentUser.name} · ${currentUser.role} · ${currentUser.dept||'Department pending'}`);document.getElementById('avatarUpload').onchange=event=>{const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){notify('Choose a PNG, JPEG, or WebP image.',true);return}if(file.size>1024*1024){notify('Profile photos must be 1 MB or smaller.',true);return}const reader=new FileReader();reader.onload=()=>{currentUser.avatar=reader.result;users=users.map(user=>user.id===currentUser.id?currentUser:user);persist();render();notify('Profile photo updated.')};reader.readAsDataURL(file)};document.querySelectorAll('[data-department]').forEach(select=>select.onchange=()=>{const user=users.find(item=>item.id===select.dataset.department);if(user){user.dept=select.value;if(user.role==='Department Head')user.headOfDept=select.value;persist();const activate=document.querySelector(`[data-activate="${CSS.escape(user.id)}"]`);if(activate)activate.disabled=!user.dept}});document.querySelectorAll('[data-save-dept]').forEach(button=>button.onclick=()=>{const user=users.find(item=>item.id===button.dataset.saveDept),select=document.querySelector(`[data-department="${CSS.escape(user.id)}"]`);if(!select?.value){notify('Select a hospital department before saving.',true);return}user.dept=select.value;if(user.role==='Department Head')user.headOfDept=select.value;persist();notify(`Department saved for ${user.name}.`);render()});document.querySelectorAll('[data-activate]').forEach(button=>button.onclick=()=>{if(currentUser.role!=='Admin'){notify('Only an admin can activate accounts.',true);return}const user=users.find(item=>item.id===button.dataset.activate);if(!user?.dept){notify('Assign and save a department before activation.',true);return}user.status='Approved';persist();notify(`${user.name} activated in ${user.dept}.`);render()});document.querySelectorAll('[data-reject]').forEach(button=>button.onclick=()=>{const user=users.find(item=>item.id===button.dataset.reject);if(user){user.status='Rejected';persist();notify(`Registration for ${user.name} rejected.`);render()}});document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>{const req=requests.find(item=>item.id===button.dataset.request);if(!req)return;const approve=button.dataset.decision==='approve';if(currentUser.role==='Department Head'&&req.status==='Pending Dept Head Approval')req.status=approve?'Pending Final Officer Approval':'Rejected';else if(['Administrative Officer V','Chief of Hospital'].includes(currentUser.role)&&req.status==='Pending Final Officer Approval')req.status=approve?'Approved':'Rejected';else if(currentUser.role==='Admin'&&req.status.startsWith('Pending'))req.status=approve?(req.status==='Pending Dept Head Approval'?'Pending Final Officer Approval':'Approved'):'Rejected';else{notify('You are not authorized for this approval stage.',true);return}req.lastUpdated=new Date().toLocaleString();persist();notify(`Request ${req.id} ${approve?'updated':'declined'}.`);render()});const form=document.getElementById('requestForm');if(form)form.onsubmit=event=>{event.preventDefault();if(!currentUser.dept){notify('Your account needs an assigned department before filing a request.',true);return}requests.unshift({id:'REQ-'+Date.now(),userId:currentUser.id,applicantName:currentUser.name,type:document.getElementById('requestType').value,section:currentUser.dept,date:new Date().toLocaleDateString(),status:'Pending Dept Head Approval',reason:document.getElementById('reason').value.trim()});persist();notify('Request submitted for Department Head approval.');activeView='requests';render()}}
    render();
  </script>
</body>
